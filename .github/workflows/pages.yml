# Construit le jeu et le publie sur GitHub Pages à chaque envoi sur main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: TRUFFE_VERSION=${GITHUB_SHA::7} npx vite build
      # D-101 : le même jeu pour l'appli Android, en paquet, avec le fichier de version que l'appli consulte.
      - name: Paquet de mise à jour de l'appli
        run: |
          V=${GITHUB_SHA::7}
          TRUFFE_VERSION=$V npx vite build --mode app
          CODE=$(grep -m1 -E '^\s*versionCode [0-9]+' android/app/build.gradle | grep -o '[0-9]\+')
          MIN=$(tr -dc '0-9' < android/min-native)
          mkdir -p dist/app
          (cd dist-app && zip -qr "../dist/app/bundle-$V.zip" .)
          cat > dist/app/latest.json <<EOF
          {"version":"$V","bundle":"https://crijo.github.io/truffe/app/bundle-$V.zip","minNative":$MIN,"native":$CODE,"apk":"https://github.com/Crijo/truffe/releases/latest/download/truffe.apk"}
          EOF
          cat dist/app/latest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
